[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashlle"
version = "0.1.0"
description = "Composable split-step LLE solver with fused Triton pointwise operators"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.3", "triton>=3.0"]

[project.optional-dependencies]
gpu = []
dev = ["pytest>=8"]
benchmark = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
