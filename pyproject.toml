[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashlle"
version = "0.1.0"
description = "Split-step NLSE solver with dispersion, Kerr nonlinearity and self-steepening"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
gpu = ["torch>=2.3", "triton>=3.0"]
dev = ["pytest>=8"]
benchmark = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
